<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* =========================================================================
   SuperTable V4 — Cursor-Light-Warmth
   暖纸白三层底色 · 暖墨黑 · 胶囊按钮 · 4px 展示面 · 弥散阴影 · 单点朱砂
   ========================================================================= */
:root{
  --bg:#F7F7F4;
  --surface:#F2F1ED;
  --surface-deep:#E6E5E0;
  --text:#26251E;
  --text-soft:#57544A;
  --gray:rgba(38,37,30,.55);
  --gray-2:rgba(38,37,30,.38);
  --bg-invert:#F7F7F4;
  --side-bg:#F2F1ED;
  --side-bg-2:#F7F7F4;
  --card:#FFFFFF;
  --border:rgba(38,37,30,.2);
  --border-2:rgba(38,37,30,.09);
  --hairline:rgba(38,37,30,.07);
  --hover:rgba(38,37,30,.05);
  --hover-2:rgba(38,37,30,.1);
  --blue:#26251E;
  --blue-soft:rgba(38,37,30,.08);
  --accent:#C8451D;
  --green-bg:#E9F1E6;
  --green-bg-strong:#DBE9D6;
  --green-text:#3F7A46;
  --red-bg:#F6E7E3;
  --red-bg-strong:#EED7D1;
  --red-text:#B0413E;
  --base-bg:#EAE7DF;
  --shadow-sm:0 0 12px rgba(38,37,30,.035);
  --shadow-md:0 0 16px rgba(38,37,30,.05),0 1px 3px rgba(38,37,30,.03);
  --shadow-lg:0 0 28px rgba(38,37,30,.09),0 2px 10px rgba(38,37,30,.05);
  --radius:4px;
  --pill:9999px;
  --side-w:256px;
  --ease:cubic-bezier(.25,1,.5,1);
  --font:'Instrument Sans','Inter Tight',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif;
  --mono:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace;
  --serif:'EB Garamond',Georgia,'Songti SC',serif;
}
[data-theme="dark"]{
  --bg:#1A1915;
  --surface:#211F1A;
  --surface-deep:#2B2922;
  --text:#F2F1ED;
  --text-soft:#C9C6BC;
  --gray:rgba(242,241,237,.56);
  --gray-2:rgba(242,241,237,.36);
  --bg-invert:#1A1915;
  --side-bg:#211F1A;
  --side-bg-2:#1A1915;
  --card:#232019;
  --border:rgba(242,241,237,.18);
  --border-2:rgba(242,241,237,.09);
  --hairline:rgba(242,241,237,.08);
  --hover:rgba(242,241,237,.06);
  --hover-2:rgba(242,241,237,.11);
  --blue:#F2F1ED;
  --blue-soft:rgba(242,241,237,.1);
  --accent:#E2673F;
  --green-bg:#1F2B21;
  --green-bg-strong:#26362A;
  --green-text:#8FC79B;
  --red-bg:#2F211D;
  --red-bg-strong:#3B2A25;
  --red-text:#DFA096;
  --base-bg:#2A2721;
  --shadow-sm:0 0 12px rgba(0,0,0,.3);
  --shadow-md:0 0 16px rgba(0,0,0,.38),0 1px 3px rgba(0,0,0,.25);
  --shadow-lg:0 0 28px rgba(0,0,0,.5),0 2px 10px rgba(0,0,0,.32);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);color:var(--text);background:var(--bg);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-.005em;overflow:hidden}
.app{display:flex;height:100vh;width:100vw}

/* ---------------- Sidebar ---------------- */
.sidebar{width:var(--side-w);flex-shrink:0;background:var(--side-bg);border-right:1px solid var(--hairline);display:flex;flex-direction:column;position:relative;transition:width .2s var(--ease);overflow:hidden}
.sidebar.collapsed{width:54px!important}
.sidebar.collapsed .side-text,.sidebar.collapsed .ws-text,.sidebar.collapsed .proj-list,.sidebar.collapsed .side-hint,.sidebar.collapsed .collapse-btn,.sidebar.collapsed .count,.sidebar.collapsed .chev{display:none!important}
.sidebar.collapsed .workspace{justify-content:center;padding:6px 0}
.sidebar.collapsed .nav-item{justify-content:center;padding:8px 0}
.sidebar.collapsed .nav-item .icon{width:22px;height:22px}
.sidebar.collapsed .side-top{padding:12px 6px 6px}
.sidebar.collapsed .side-nav{padding:8px 6px}
.sidebar.collapsed .side-bottom{padding:8px 6px}
.sidebar.collapsed .expand-btn{display:flex!important}
.resize-handle{position:absolute;top:0;right:-3px;width:6px;height:100%;cursor:col-resize;z-index:60}
.resize-handle:hover,.resize-handle.active{background:var(--text);opacity:.18;border-radius:3px}
.sidebar.collapsed .resize-handle{display:none}
.side-top{padding:14px 12px 8px;flex-shrink:0}
.workspace{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:var(--radius);cursor:default;user-select:none;min-width:0}
.ws-logo{width:28px;height:28px;flex-shrink:0;cursor:pointer;display:block;transition:transform .14s var(--ease)}
.ws-logo svg{display:block;width:28px;height:28px;border-radius:6px}
.ws-logo:hover{transform:scale(1.08)}
.ws-logo .mark-light{display:block;line-height:0}
.ws-logo .mark-dark{display:none;line-height:0}
.ws-logo .mark-light svg,.ws-logo .mark-dark svg{width:28px;height:28px;display:block;border-radius:6px}
[data-theme="dark"] .ws-logo .mark-light{display:none}
[data-theme="dark"] .ws-logo .mark-dark{display:block}
[data-theme="dark"] .ws-logo .mark-light{display:none}
[data-theme="dark"] .ws-logo .mark-dark{display:block}
.ws-text{min-width:0;flex:1;display:flex;align-items:center;gap:6px}
.ws-name{font-weight:600;font-size:13.5px;letter-spacing:-.012em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.collapse-btn{width:22px;height:22px;border-radius:var(--pill);border:none;background:transparent;color:var(--gray);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.12s;margin-left:auto}
.collapse-btn:hover{background:var(--hover-2);color:var(--text)}
.expand-btn{display:none;width:32px;height:32px;border-radius:var(--pill);border:none;background:transparent;color:var(--text-soft);cursor:pointer;align-items:center;justify-content:center;margin:8px auto 0}
.expand-btn:hover{background:var(--hover)}
.side-nav{padding:8px;overflow-y:auto;overflow-x:hidden;flex:1}
.nav-item{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:var(--pill);cursor:pointer;color:var(--text-soft);font-size:13.5px;font-weight:500;user-select:none;transition:background .12s,color .12s;white-space:nowrap}
.nav-item:hover{background:var(--hover)}
.nav-item.active{background:var(--hover-2);color:var(--text);font-weight:600}
.nav-item .icon{width:18px;height:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center;opacity:.8}
.nav-item .chev{margin-left:auto;width:16px;height:16px;transition:transform .15s;opacity:.55;flex-shrink:0}
.nav-item .chev.open{transform:rotate(90deg)}
.nav-item .count{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--gray);background:var(--hover-2);border-radius:var(--pill);padding:0 7px;line-height:17px;font-weight:500;flex-shrink:0}
.side-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj-list{margin:2px 0 6px 0;overflow:hidden}.proj-list.hide{display:none}
.proj-item{display:flex;align-items:center;gap:8px;padding:5px 9px 5px 32px;border-radius:var(--pill);cursor:pointer;color:var(--text-soft);font-size:13px;position:relative;user-select:none;transition:background .12s,color .12s;white-space:nowrap}
.proj-item:hover{background:var(--hover)}.proj-item.active{background:var(--hover-2);color:var(--text);font-weight:600}
.proj-item .dot{width:6px;height:6px;border-radius:50%;background:var(--gray-2);flex-shrink:0}
.proj-item.active .dot{background:var(--accent)}
.proj-item .pname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.proj-item .del,.snap-item .del{opacity:0;width:18px;height:18px;border-radius:var(--pill);display:flex;align-items:center;justify-content:center;color:var(--gray);flex-shrink:0}
.proj-item:hover .del,.snap-item:hover .del{opacity:1}
.proj-item .del:hover,.snap-item .del:hover{background:var(--red-bg);color:var(--red-text)}
.proj-empty{padding:6px 9px 6px 32px;font-size:12px;color:var(--gray-2);font-family:var(--serif);font-style:italic}
.snap-item{display:flex;align-items:center;gap:7px;padding:4px 9px 4px 48px;border-radius:var(--pill);cursor:pointer;color:var(--gray);font-size:12.5px;user-select:none;transition:background .12s,color .12s;white-space:nowrap}
.snap-item:hover{background:var(--hover);color:var(--text-soft)}
.snap-item.active{background:var(--hover-2);color:var(--text);font-weight:600}
.snap-item .snap-ico{width:14px;height:14px;flex-shrink:0;opacity:.65}
.snap-item .sname{overflow:hidden;text-overflow:ellipsis;flex:1}
.side-bottom{padding:10px 8px;border-top:1px solid var(--hairline);background:var(--side-bg-2);flex-shrink:0}
.side-hint{font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;color:var(--gray-2);padding:2px 10px 4px;line-height:1.6;white-space:nowrap;overflow:hidden}

/* ---------------- Topbar / content ---------------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.topbar{height:52px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--hairline)}
.icon-btn{width:30px;height:30px;border-radius:var(--pill);border:none;background:transparent;color:var(--text-soft);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .12s}
.icon-btn:hover{background:var(--hover)}
.crumb{font-family:var(--mono);font-size:11.5px;letter-spacing:.02em;color:var(--gray);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--text);font-weight:500}
.topbar .spacer{flex:1}
.content{flex:1;overflow-y:auto;overflow-x:hidden}
.page{max-width:1180px;margin:0 auto;padding:52px 40px 96px;animation:fadeSlideUp .32s var(--ease) both}
.page.wide{max-width:none;padding:24px 24px 80px}

/* ---------------- Typography ---------------- */
h1.title{font-family:var(--font);font-size:38px;font-weight:400;letter-spacing:-.72px;line-height:1.18;margin-bottom:10px;display:flex;flex-direction:column}
h1.title .l1{color:var(--text)}
h1.title .l2{color:var(--gray);font-family:var(--serif);font-style:italic;letter-spacing:-.3px}
h1.title .accent{font-family:var(--serif);font-style:italic;color:var(--gray)}
.subtitle{color:var(--gray);font-size:15px;line-height:1.65;max-width:62ch;margin-bottom:32px}
h2.sec{font-size:20px;font-weight:400;letter-spacing:-.325px;margin:52px 0 16px;display:flex;align-items:center;gap:10px}
h2.sec .bar{width:18px;height:1px;background:var(--border);border-radius:0}
.link-accent{display:inline-flex;align-items:center;gap:5px;color:var(--accent);font-size:14px;font-weight:500;text-decoration:none;cursor:pointer;padding:6px 0;transition:opacity .14s var(--ease)}
.link-accent .arw{transition:transform .14s var(--ease)}
.link-accent:hover .arw{transform:translateX(2px)}
.link-accent:hover{text-decoration:underline;text-underline-offset:3px}

/* ---------------- Hero / media stage ---------------- */
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.stage{position:relative;margin-top:36px;border-radius:var(--radius);padding:64px 32px 56px;overflow:hidden;
  background:
    radial-gradient(120% 95% at 16% 10%,rgba(219,183,112,.62),transparent 58%),
    radial-gradient(105% 85% at 84% 16%,rgba(150,166,118,.55),transparent 62%),
    radial-gradient(130% 110% at 52% 112%,rgba(74,96,84,.62),transparent 66%),
    linear-gradient(158deg,#E9D9B7 0%,#D2C89F 34%,#A9AE8B 70%,#7C8B78 100%);
}
.stage::after{content:'';position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 70px rgba(58,42,18,.22)}
.stage-plate{position:absolute;left:24px;bottom:18px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:rgba(38,37,30,.5);background:rgba(247,247,244,.55);padding:4px 10px;border-radius:var(--radius);z-index:3}
.stage-inner{position:relative;max-width:720px;margin:0 auto}
.win{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-lg);overflow:hidden}
.win-bar{height:38px;display:flex;align-items:center;gap:7px;padding:0 13px;border-bottom:1px solid var(--hairline);background:rgba(247,247,244,.9)}
[data-theme="dark"] .win-bar{background:rgba(242,241,237,.05)}
.win-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.win-dot.r{background:#C8655E}.win-dot.y{background:#D9A65C}.win-dot.g{background:#6E9E72}
[data-theme="dark"] .win-dot.r{background:#7E4640}[data-theme="dark"] .win-dot.y{background:#7C6237}[data-theme="dark"] .win-dot.g{background:#3F5C42}
.win-title{flex:1;text-align:center;font-family:var(--mono);font-size:11px;letter-spacing:.02em;color:var(--gray);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win-meta{font-family:var(--mono);font-size:10px;letter-spacing:.03em;color:var(--gray-2);flex-shrink:0}
.win-back{position:absolute;top:-38px;right:-26px;width:58%;z-index:1;opacity:.97;transform:rotate(.4deg)}
.win-front{position:relative;z-index:2;width:86%;margin-left:auto;margin-right:6%}
.win-body{padding:18px}
.mini-rows{padding:10px 14px 14px}
.mini-row{display:flex;align-items:center;gap:10px;padding:6px 2px;border-bottom:1px solid var(--hairline);font-family:var(--mono);font-size:11px;color:var(--text-soft)}
.mini-row:last-child{border-bottom:none}
.mini-row .mk{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-row .mv{color:var(--text);font-weight:500}
.mini-row .md{width:52px;text-align:right;font-size:10px}
.mini-row .md.up{color:var(--green-text)}.mini-row .md.down{color:var(--red-text)}

/* ---------------- Dropzone ---------------- */
.dropzone{border:1px dashed var(--border);border-radius:var(--radius);background:var(--side-bg-2);padding:48px 32px;text-align:center;cursor:pointer;transition:background .14s var(--ease),border-color .14s var(--ease)}
.dropzone:hover{border-color:var(--text);background:var(--hover)}
.dropzone.drag{border-color:var(--text);background:var(--hover);transform:scale(.995)}
.dz-icon{width:52px;height:52px;margin:0 auto 16px;border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow-md);display:flex;align-items:center;justify-content:center;color:var(--text)}
.dz-title{font-size:16px;font-weight:500;letter-spacing:-.2px;margin-bottom:6px}
.dz-desc{color:var(--gray);font-size:13px}
.dz-formats{margin-top:18px;display:flex;gap:8px;justify-content:center}
.fmt{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;padding:3px 11px;border-radius:var(--pill);background:var(--card);border:1px solid var(--border-2);color:var(--text-soft)}

/* ---------------- Cards / steps ---------------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:8px}
.card{border:1px solid var(--border-2);border-radius:var(--radius);padding:18px 20px;background:var(--card);transition:box-shadow .14s var(--ease);cursor:default}
.card:hover{box-shadow:var(--shadow-md)}
.card .k{font-family:var(--mono);font-size:26px;font-weight:500;letter-spacing:-.03em;color:var(--text);font-variant-numeric:tabular-nums}
.card .l{font-size:12.5px;color:var(--gray);margin-top:3px}
.card.clickable{cursor:pointer}
.steps{margin-top:6px;border:1px solid var(--border-2);border-radius:var(--radius);overflow:hidden;background:var(--card)}
.step{display:flex;gap:16px;padding:18px 22px;border-bottom:1px solid var(--hairline);align-items:flex-start}
.step:last-child{border-bottom:none}
.step .n{width:24px;height:24px;border-radius:var(--pill);background:var(--text);color:var(--bg-invert);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;font-family:var(--mono);margin-top:1px}
.step .st{font-weight:600;font-size:14px;letter-spacing:-.1px}
.step .sd{color:var(--gray);font-size:13px;margin-top:3px;line-height:1.6;max-width:72ch}

/* ---------------- Toolbar / form controls ---------------- */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 2px;margin-bottom:14px;position:sticky;top:0;z-index:20;background:var(--bg)}
.field{display:flex;align-items:center;gap:7px}
.field label{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--gray);white-space:nowrap}
select,input[type="text"],input[type="number"]{font-family:var(--font);font-size:13px;color:var(--text);background:var(--card);border:1px solid var(--border);border-radius:var(--pill);padding:6px 13px;outline:none;transition:border-color .12s var(--ease);min-width:0}
select:hover,input:hover{border-color:var(--gray-2)}
select:focus,input:focus{border-color:var(--text)}
.search-wrap{position:relative}
.search-wrap input{padding-left:30px;width:170px}
.search-wrap .s-ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--gray);pointer-events:none}
.btn{font-family:var(--font);font-size:13px;font-weight:500;color:var(--text);background:transparent;border:1px solid var(--border);border-radius:var(--pill);padding:7px 15px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .14s var(--ease),transform .14s var(--ease),opacity .14s var(--ease);white-space:nowrap}
.btn:hover{background:var(--hover);transform:scale(.98)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.primary{background:var(--text);color:var(--bg-invert);border-color:var(--text)}
.btn.primary:hover{background:#3A382F;opacity:1}
[data-theme="dark"] .btn.primary:hover{background:#E4E2DA;color:#1A1915}
.btn.danger:hover{background:var(--red-bg);color:var(--red-text);border-color:var(--red-text)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn .badge{background:var(--text);color:var(--bg-invert);font-family:var(--mono);font-size:10px;border-radius:var(--pill);padding:0 6px;line-height:16px;margin-left:3px}
.btn .badge-update{background:var(--green-text);color:#fff;font-family:var(--mono);font-size:10px;border-radius:var(--pill);padding:0 6px;line-height:16px;margin-left:3px}
.seg{display:flex;border:1px solid var(--border);border-radius:var(--pill);overflow:hidden;background:var(--card)}
.seg button{border:none;background:transparent;font-family:var(--font);font-size:12.5px;font-weight:500;color:var(--gray);padding:6px 12px;cursor:pointer;transition:.12s}

.col-filter-wrap{position:relative}
.col-dropdown{position:absolute;top:calc(100% + 8px);left:0;min-width:230px;max-height:320px;overflow-y:auto;background:var(--card);border:1px solid var(--border-2);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:8px 0;z-index:100;display:none}
.col-dropdown.open{display:block}

.col-dropdown .cd-item:hover{background:var(--hover)}
.col-dropdown .cd-item input{width:15px;height:15px;accent-color:var(--text);cursor:pointer;border-radius:0}
.col-dropdown .cd-item.off{opacity:.45}
.col-dropdown .cd-head{padding:6px 14px;font-family:var(--mono);font-size:10px;font-weight:500;color:var(--gray);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--hairline);margin-bottom:4px}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin:0 2px 12px;font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;color:var(--gray)}

.swatch{width:13px;height:13px;border-radius:3px;border:1px solid var(--hairline)}

/* ---------------- Table window ---------------- */
.table-wrap{border:1px solid var(--border-2);border-radius:var(--radius);overflow:auto;box-shadow:var(--shadow-md);max-height:calc(100vh - 250px);background:var(--card)}

table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
thead th{position:sticky;top:0;z-index:5;background:var(--surface);text-align:left;font-weight:600;color:var(--text-soft);font-size:11px;padding:11px 13px;border-bottom:1px solid var(--border-2);white-space:nowrap;letter-spacing:.01em}
thead th .sub{display:block;font-family:var(--mono);font-size:9.5px;font-weight:400;color:var(--gray-2);margin-top:2px;letter-spacing:.04em}

td.chk-col{text-align:center;padding:8px 6px;width:38px;min-width:38px;max-width:38px;position:sticky;left:0;z-index:4;background:var(--card)}

td.num.cell-bad{background:var(--red-bg-strong)}

.switch{width:42px;height:24px;border-radius:var(--pill);background:var(--hover-2);border:none;cursor:pointer;position:relative;flex-shrink:0;transition:background .15s var(--ease)}

.chip-input{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--border);border-radius:var(--radius);padding:7px 9px;background:var(--side-bg-2);max-width:340px}

/* ---------------- Empty / toast ---------------- */
.empty{padding:80px 20px;text-align:center;color:var(--gray)}
.empty .big{font-family:var(--serif);font-style:italic;font-size:30px;font-weight:400;color:var(--text);margin-bottom:10px;letter-spacing:-.3px}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg-invert);padding:10px 20px;border-radius:var(--pill);font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity .22s var(--ease),transform .22s var(--ease);z-index:100}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--red-text)}
.toast.ok{background:var(--green-text)}

/* ---------------- Misc ---------------- */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--hover-2);border-radius:var(--pill);border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--gray-2)}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}
@keyframes fadeSlideUp{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media(max-width:760px){
  .page{padding:28px 18px 60px}
  .page.wide{padding:16px 14px 60px}
  .sidebar{position:absolute;z-index:50;height:100%}
  h1.title{font-size:28px;letter-spacing:-.5px}
  .stage{padding:40px 16px 44px}
  .win-back{display:none}
  .win-front{width:100%;margin:0}
  .toolbar{position:static}
}
</style>

<script>
/* =========================================================================
   SuperTable V4 — State & Constants
   ========================================================================= */
const STORAGE_KEY='supertable_v3_state';
const defaultSettings={defaultSortColumn:'mAP50 (IoU=0.50)',baselineKeyword:'baseline',decimals:2,showDiff:true,colorPerCell:false,lowerBetterKeywords:['parameters','gflops','flops','params','latency','time'],infoKeywords:['model','type','epoch','imgsz','date','name','id','note','remark','dataset','seed'],theme:'light'};
const state={projects:[],activeId:null,view:'home',projectsOpen:true,sideCollapsed:false,sideWidth:256,seq:0,settings:{...defaultSettings}};
const $=s=>document.querySelector(s);
const content=$('#content');
const nf=(v,d=2)=>(v==null||isNaN(v))?'\u2014':Number(v).toFixed(d);

/* =========================================================================
   Persistence (localStorage)
   ========================================================================= */
function persist(){try{const data={v:3,seq:state.seq,activeId:state.activeId,sideWidth:state.sideWidth,settings:state.settings,projects:state.projects.map(p=>({id:p.id,name:p.name,headers:p.headers,rows:p.rows,numericCols:[...p.numericCols],infoCols:[...p.infoCols],lowerBetter:[...p.lowerBetter],compareOff:[...p.compareOff],hiddenCols:[...(p.hiddenCols||[])],baselineIdx:p.baselineIdx,sortCol:p.sortCol,sortDir:p.sortDir,checkedRows:[...p.checkedRows],isSnapshot:p.isSnapshot,parentId:p.parentId,updatedAt:p.updatedAt||null}))};localStorage.setItem(STORAGE_KEY,JSON.stringify(data));}catch(e){console.warn('persist',e);}}
function restore(){try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return false;const d=JSON.parse(raw);state.seq=d.seq||0;state.activeId=d.activeId||null;state.sideWidth=d.sideWidth||256;if(d.settings)Object.assign(state.settings,d.settings);if(d.projects)state.projects=d.projects.map(p=>({...p,numericCols:new Set(p.numericCols),infoCols:new Set(p.infoCols),lowerBetter:new Set(p.lowerBetter),compareOff:new Set(p.compareOff),hiddenCols:new Set(p.hiddenCols||[]),checkedRows:new Set(p.checkedRows||[]),filter:''}));return state.projects.length>0;}catch(e){console.warn('restore',e);return false;}}
function clearStorage(){localStorage.removeItem(STORAGE_KEY);}
function getStorageSize(){try{const d=localStorage.getItem(STORAGE_KEY);return d?(d.length/1024).toFixed(1)+'KB':'0KB';}catch(e){return '?';}}

/* [NEW V3] Export / Import full data as JSON file */
function exportAllData(){
  const data={_meta:{app:'SuperTable',version:3,exportedAt:new Date().toISOString(),projectCount:state.projects.length},seq:state.seq,settings:state.settings,projects:state.projects.map(p=>({id:p.id,name:p.name,headers:p.headers,rows:p.rows,numericCols:[...p.numericCols],infoCols:[...p.infoCols],lowerBetter:[...p.lowerBetter],compareOff:[...p.compareOff],hiddenCols:[...(p.hiddenCols||[])],baselineIdx:p.baselineIdx,sortCol:p.sortCol,sortDir:p.sortDir,checkedRows:[...p.checkedRows],isSnapshot:p.isSnapshot,parentId:p.parentId,updatedAt:p.updatedAt||null}))};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;
  const d=new Date();a.download='SuperTable_Backup_'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  toast('数据已导出 ('+state.projects.length+' 个项目)','ok');
}
function importAllData(jsonStr){
  try{
    const d=JSON.parse(jsonStr);
    if(!d.projects||!Array.isArray(d.projects))throw new Error('无效的数据格式');
    if(!confirm('导入将覆盖当前所有数据（'+state.projects.length+' 个项目），确认继续？'))return;
    state.projects=d.projects.map(p=>({...p,numericCols:new Set(p.numericCols||[]),infoCols:new Set(p.infoCols||[]),lowerBetter:new Set(p.lowerBetter||[]),compareOff:new Set(p.compareOff||[]),hiddenCols:new Set(p.hiddenCols||[]),checkedRows:new Set(p.checkedRows||[]),filter:''}));
    state.seq=d.seq||state.projects.length;
    if(d.settings)Object.assign(state.settings,d.settings);
    state.activeId=state.projects.find(p=>!p.isSnapshot)?.id||state.projects[0]?.id||null;
    persist();setTheme(state.settings.theme);
    if(state.activeId)setActive(state.activeId);else setView('home');
    renderProjectList();toast('已导入 '+state.projects.length+' 个项目','ok');
  }catch(e){toast('导入失败：'+e.message,true);}
}

/* =========================================================================
   Utilities
   ========================================================================= */
function toast(msg,type){const t=$('#toast');t.textContent=msg;t.className='toast show'+(type==='err'?' err':type==='ok'?' ok':'');clearTimeout(t._tm);t._tm=setTimeout(()=>t.className='toast',2800);}
function norm(s){return String(s==null?'':s).toLowerCase().trim();}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function isLowerBetter(h){return state.settings.lowerBetterKeywords.some(k=>norm(h).includes(k));}
function isInfoCol(h){return state.settings.infoKeywords.some(k=>norm(h)===k);}
function detectNumericCol(values){let n=0,ne=0;for(const v of values){if(v==null||v==='')continue;ne++;const num=typeof v==='number'?v:parseFloat(String(v).replace(/[, ]/g,''));if(!isNaN(num)&&isFinite(num))n++;}return ne>0&&n/ne>=.7;}
function toNum(v){if(typeof v==='number')return v;if(v==null||v==='')return NaN;const n=parseFloat(String(v).replace(/[, ]/g,''));return isNaN(n)?NaN:n;}

/* =========================================================================
   [NEW V3] File handling with same-name overwrite
   ========================================================================= */
let _dropLock=false;
function handleFiles(fileList){
  if(_dropLock)return;_dropLock=true;setTimeout(()=>_dropLock=false,300);
  const files=Array.from(fileList||[]);if(!files.length)return;
  let pending=files.length,done=0,updated=0,created=0;
  files.forEach(file=>{
    const reader=new FileReader();
    const ext=file.name.split('.').pop().toLowerCase();
    reader.onload=e=>{
      try{
        let wb;
        if(ext==='csv')wb=XLSX.read(new TextDecoder('utf-8').decode(new Uint8Array(e.target.result)),{type:'string'});
        else wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true,blankrows:false});
        // [V3] Check for same-name project (non-snapshot)
        const existing=state.projects.find(p=>!p.isSnapshot&&p.name===file.name);
        if(existing){updateProject(existing,aoa);updated++;}
        else{addProject(file.name,aoa);created++;}
        done++;
        if(done===pending){
          if(updated&&!created){toast('已更新 '+updated+' 个项目（快照保留）','ok');render();}
          else if(updated&&created){toast('更新 '+updated+' 个 + 新建 '+created+' 个','ok');setActive(state.projects[state.projects.length-1].id);}
          else{setActive(state.projects[state.projects.length-1].id);toast('已导入 '+created+' 个文件');}
          persist();
        }
      }catch(err){console.error(err);done++;toast('解析失败：'+file.name,true);}
    };
    reader.readAsArrayBuffer(file);
  });
}

/* [NEW V3] Update existing project in-place, preserving snapshots */
function updateProject(proj,aoa){
  if(!aoa||aoa.length<2)return;
  const headers=aoa[0].map((h,i)=>(h==null||String(h).trim()==='')?'列'+(i+1):String(h).trim());
  const rows=aoa.slice(1).filter(r=>r.some(c=>c!=null&&String(c).trim()!==''));
  const ncol=headers.length;
  // Re-detect column types
  const numericCols=new Set(),infoCols=new Set(),lowerBetter=new Set();
  for(let c=0;c<ncol;c++){const vals=rows.map(r=>r[c]);if(detectNumericCol(vals)){numericCols.add(c);if(isInfoCol(headers[c]))infoCols.add(c);if(isLowerBetter(headers[c]))lowerBetter.add(c);}}
  // Update project data
  proj.headers=headers;proj.rows=rows;proj.numericCols=numericCols;proj.infoCols=infoCols;proj.lowerBetter=lowerBetter;
  proj.compareOff=new Set([...proj.compareOff].filter(c=>c<ncol));
  proj.hiddenCols=new Set([...(proj.hiddenCols||[])].filter(c=>c<ncol));
  proj.checkedRows=new Set(); // reset checkboxes since row indices changed
  proj.updatedAt=new Date().toISOString();
  // Re-find sort column
  if(proj.sortCol>=ncol||!numericCols.has(proj.sortCol)){
    const dsc=norm(state.settings.defaultSortColumn);
    let sc=-1;headers.forEach((h,i)=>{if(sc<0&&numericCols.has(i)&&norm(h)===dsc)sc=i;});
    if(sc<0)headers.forEach((h,i)=>{if(sc<0&&numericCols.has(i)&&norm(h).includes(dsc))sc=i;});
    if(sc<0){for(const c of numericCols){if(!infoCols.has(c)){sc=c;break;}}}
    proj.sortCol=sc>=0?sc:0;
  }
  // Re-find baseline
  const kw=norm(state.settings.baselineKeyword);
  let bi=kw?rows.findIndex(r=>norm(r[0]).includes(kw)):-1;
  proj.baselineIdx=bi>=0?bi:Math.min(proj.baselineIdx,rows.length-1);
  // Snapshots remain untouched (they are separate project entries with parentId === proj.id)
  renderProjectList();
}

function addProject(name,aoa,opts={}){
  if(!aoa||aoa.length<2){toast('表格为空',true);return null;}
  const headers=(opts.headers||aoa[0]).map((h,i)=>(h==null||String(h).trim()==='')?'列'+(i+1):String(h).trim());
  const rows=(opts.rows||aoa.slice(1)).filter(r=>r.some(c=>c!=null&&String(c).trim()!==''));
  const ncol=headers.length;
  const numericCols=new Set(),infoCols=new Set(),lowerBetter=new Set();
  for(let c=0;c<ncol;c++){const vals=rows.map(r=>r[c]);if(detectNumericCol(vals)){numericCols.add(c);if(isInfoCol(headers[c]))infoCols.add(c);if(isLowerBetter(headers[c]))lowerBetter.add(c);}}
  let sortCol=-1;const dsc=norm(state.settings.defaultSortColumn);
  headers.forEach((h,i)=>{if(sortCol<0&&numericCols.has(i)&&norm(h)===dsc)sortCol=i;});
  if(sortCol<0)headers.forEach((h,i)=>{if(sortCol<0&&numericCols.has(i)&&norm(h).includes(dsc))sortCol=i;});
  if(sortCol<0){for(const c of numericCols){if(!infoCols.has(c)){sortCol=c;break;}}}
  if(sortCol<0&&numericCols.size)sortCol=[...numericCols][0];
  let baselineIdx=-1;const kw=norm(state.settings.baselineKeyword);
  if(kw)baselineIdx=rows.findIndex(r=>norm(r[0]).includes(kw));
  if(baselineIdx<0)baselineIdx=0;
  const proj={id:'p'+(++state.seq),name,headers,rows,numericCols,infoCols,lowerBetter,compareOff:new Set(),hiddenCols:new Set(opts.hiddenCols||[]),baselineIdx,sortCol,sortDir:'desc',filter:'',checkedRows:new Set(),isSnapshot:!!opts.isSnapshot,parentId:opts.parentId||null,updatedAt:new Date().toISOString()};
  state.projects.push(proj);renderProjectList();persist();return proj;
}

function createSnapshot(p){
  const checked=[...p.checkedRows];if(!checked.length){toast('请先勾选行',true);return;}
  if(!checked.includes(p.baselineIdx))checked.push(p.baselineIdx);
  checked.sort((a,b)=>a-b);
  const snapRows=checked.map(i=>p.rows[i]);
  const now=new Date();const ts=(now.getMonth()+1)+'/'+now.getDate()+' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  const snapName='快照 '+ts+' ('+snapRows.length+'行'+(p.hiddenCols.size?','+visibleCols(p).length+'列':'')+')';
  const snap=addProject(snapName,[p.headers,...snapRows],{isSnapshot:true,parentId:p.id,headers:p.headers,rows:snapRows,hiddenCols:[...p.hiddenCols]});
  if(snap){const kw=norm(state.settings.baselineKeyword);const bi=snap.rows.findIndex(r=>norm(r[0]).includes(kw));if(bi>=0)snap.baselineIdx=bi;snap.sortCol=p.sortCol;snap.sortDir=p.sortDir;p.checkedRows.clear();setActive(snap.id);persist();toast('快照已创建','ok');}
}

function exportCSV(p){
  const visCols=visibleCols(p);
  const eh=['Model',...visCols.map(c=>p.headers[c])];
  let csv=eh.map(h=>'"'+String(h).replace(/"/g,'""')+'"').join(',')+'\n';
  p.rows.forEach(r=>{csv+=[r[0],...visCols.map(c=>r[c])].map(c=>{if(c==null)return'';const s=String(c);return s.includes(',')||s.includes('"')||s.includes('\n')?'"'+s.replace(/"/g,'""')+'"':s;}).join(',')+'\n';});
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;
  a.download=p.name.replace(/\.(xlsx|xls|csv)$/i,'')+'.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  toast('CSV 已导出','ok');
}

function renderLegend(p){const L=$('#legend');if(!L)return;L.innerHTML=`<span class="li"><span class="swatch" style="background:var(--green-bg-strong)"></span>优于基线</span><span class="li"><span class="swatch" style="background:var(--red-bg-strong)"></span>劣于基线</span><span class="li"><span class="swatch" style="background:var(--base-bg);border:1px solid var(--gray-2)"></span>基线行</span><span class="li" style="margin-left:auto;font-family:var(--mono);font-size:11px">${p.rows.length}R \u00d7 ${visibleCols(p).length}C</span>`;}

function renderTable(p){
  renderLegend(p);const s=state.settings,d=s.decimals,holder=$('#table-holder');
  const order=sortedRows(p),baseRow=p.rows[p.baselineIdx],baseVals={};p.numericCols.forEach(c=>baseVals[c]=toNum(baseRow[c]));
  const filter=norm(p.filter);
  const shown=order.filter(i=>!filter||norm(p.rows[i][0]).includes(filter)||p.rows[i].some(v=>norm(v).includes(filter)));
  const cols=visibleCols(p);
  let thead='<tr><th class="chk-col"><input type="checkbox" id="chk-all"/></th><th class="model">Model<span class="sub">实验模型</span></th>';
  cols.forEach(c=>{const isNum=p.numericCols.has(c),lb=p.lowerBetter.has(c),off=p.compareOff.has(c);const cls=[isNum?'num':'',isNum&&!p.infoCols.has(c)?'sortable':'',lb?'lower-better':'',off?'compare-off':'',c===p.sortCol?'sorted':''].filter(Boolean).join(' ');const arrow=c===p.sortCol?(p.sortDir==='desc'?'\u2193':'\u2191'):'\u2195';thead+='<th class="'+cls+'" data-col="'+c+'">'+escapeHtml(p.headers[c])+(lb&&!p.infoCols.has(c)?'<span class="taglb">\u2193好</span>':'')+'<span class="sarrow">'+arrow+'</span></th>';});
  thead+='</tr>';
  let tbody='';
  shown.forEach(i=>{
    const r=p.rows[i],isBase=i===p.baselineIdx;let rowCls=isBase?'row-base':'';
    if(!isBase&&!s.colorPerCell&&p.numericCols.has(p.sortCol)&&!p.infoCols.has(p.sortCol)&&!p.compareOff.has(p.sortCol)&&!p.hiddenCols.has(p.sortCol)){const v=toNum(r[p.sortCol]),b=baseVals[p.sortCol];if(!isNaN(v)&&!isNaN(b)){if(v>b)rowCls='row-good';else if(v<b)rowCls='row-bad';}}
    tbody+='<tr class="'+rowCls+'"><td class="chk-col"><input type="checkbox" class="row-chk" data-idx="'+i+'" '+(p.checkedRows.has(i)?'checked':'')+'/></td>';
    tbody+='<td class="model"><div class="mname">'+escapeHtml(String(r[0]??''))+(isBase?'<span class="base-badge">BASE</span>':'')+'</div><div class="mmeta">#'+(i+1)+'</div></td>';
    cols.forEach(c=>{const raw=r[c];
      if(!p.numericCols.has(c)){tbody+='<td class="text">'+escapeHtml(String(raw==null?'':raw))+'</td>';return;}
      if(p.infoCols.has(c)){tbody+='<td class="num"><div class="val" style="font-weight:500;color:var(--text-soft)">'+escapeHtml(String(raw==null?'':raw))+'</div></td>';return;}
      const v=toNum(raw),b=baseVals[c],lb=p.lowerBetter.has(c),off=p.compareOff.has(c);
      let cellCls='',diffHtml='';const vStr=isNaN(v)?'\u2014':nf(v,d);
      if(isBase){diffHtml='<div class="diff flat">基准</div>';}
      else if(!isNaN(v)&&!isNaN(b)){const diff=v-b,better=lb?(v<b):(v>b),worse=lb?(v>b):(v<b);if(s.colorPerCell&&!off)cellCls=better?'cell-good':(worse?'cell-bad':'');const sign=diff>0?'+':'',arrow=diff>0?'\u25b2':(diff<0?'\u25bc':'\u25a0');const dcls=off?'flat':(better?'up':(worse?'down':'flat'));if(s.showDiff)diffHtml='<div class="diff '+dcls+'">'+arrow+' '+sign+nf(diff,d)+'</div>';}
      tbody+='<td class="num '+cellCls+'"><div class="val">'+vStr+'</div>'+diffHtml+'</td>';
    });
    tbody+='</tr>';
  });
  if(!shown.length)tbody='<tr><td colspan="'+(cols.length+2)+'" style="text-align:center;color:var(--gray);padding:30px">无匹配行</td></tr>';
  holder.innerHTML='<div class="table-wrap"><table><thead>'+thead+'</thead><tbody>'+tbody+'</tbody></table></div>';
  holder.querySelectorAll('th[data-col]').forEach(th=>{const c=+th.dataset.col;th.onclick=e=>{if(e.shiftKey){if(p.infoCols.has(c))return;p.compareOff.has(c)?p.compareOff.delete(c):p.compareOff.add(c);renderTable(p);persist();return;}if(p.numericCols.has(c)){if(p.sortCol===c)p.sortDir=p.sortDir==='desc'?'asc':'desc';else{p.sortCol=c;p.sortDir='desc';}renderProject();}};});
  const chkAll=$('#chk-all');
  if(chkAll){const allChk=shown.length>0&&shown.every(i=>p.checkedRows.has(i));chkAll.checked=allChk;chkAll.indeterminate=!allChk&&shown.some(i=>p.checkedRows.has(i));chkAll.onchange=()=>{shown.forEach(i=>{chkAll.checked?p.checkedRows.add(i):p.checkedRows.delete(i);});renderTable(p);};}
  holder.querySelectorAll('.row-chk').forEach(cb=>{cb.onchange=()=>{const idx=+cb.dataset.idx;cb.checked?p.checkedRows.add(idx):p.checkedRows.delete(idx);updateSnapBtn(p);const all=$('#chk-all');if(all){all.checked=shown.every(i=>p.checkedRows.has(i));all.indeterminate=!all.checked&&shown.some(i=>p.checkedRows.has(i));}};});
  updateSnapBtn(p);
}
function updateSnapBtn(p){const btn=$('#btn-snapshot');if(!btn)return;const n=p.checkedRows.size;btn.disabled=!n;btn.innerHTML='快照'+(n?' <span class="badge">'+n+'</span>':'');}

/* ---------------- SETTINGS ---------------- */
function renderSettings(){
  const s=state.settings;
  content.innerHTML=`<div class="page">
    <h1 class="title">设置</h1>
    <div class="subtitle">配置默认行为与数据管理。</div>
    <h2 class="sec"><span class="bar"></span>对比与排序</h2>
    <div class="set-group">
      <div class="set-row"><div class="info"><div class="t">默认排序列</div><div class="d">导入后按此列降序。</div></div><input type="text" id="set-sortcol" value="${escapeHtml(s.defaultSortColumn)}" style="width:220px"/></div>
      <div class="set-row"><div class="info"><div class="t">基线关键字</div><div class="d">Model 名含此词的行自动设为基线。</div></div><input type="text" id="set-baseline" value="${escapeHtml(s.baselineKeyword)}" style="width:220px"/></div>
      <div class="set-row"><div class="info"><div class="t">数值精度</div><div class="d">小数位数。</div></div><input type="number" id="set-dec" min="0" max="6" step="1" value="${s.decimals}" style="width:80px"/></div>
      <div class="set-row"><div class="info"><div class="t">显示差值</div></div><button class="switch ${s.showDiff?'on':''}" id="set-diff"></button></div>
      <div class="set-row"><div class="info"><div class="t">逐格着色</div><div class="d">开启后每个数值格独立着色。</div></div><button class="switch ${s.colorPerCell?'on':''}" id="set-percell"></button></div>
    </div>
    <h2 class="sec"><span class="bar"></span>方向规则</h2>
    <div class="set-group">
      <div class="set-row"><div class="info"><div class="t">\u300c越小越好\u300d列关键字</div></div></div>
      <div style="padding:0 18px 16px"><div class="chip-input" id="chips-lb"></div></div>
      <div class="set-row"><div class="info"><div class="t">信息列关键字（不参与对比）</div></div></div>
      <div style="padding:0 18px 16px"><div class="chip-input" id="chips-info"></div></div>
    </div>
    <h2 class="sec"><span class="bar"></span>外观</h2>
    <div class="set-group"><div class="set-row"><div class="info"><div class="t">深色主题</div></div><button class="switch ${s.theme==='dark'?'on':''}" id="set-theme"></button></div></div>
    <h2 class="sec"><span class="bar"></span>数据管理</h2>
    <div class="set-group">
      <div class="set-row"><div class="info"><div class="t">本地存储</div><div class="d">所有项目、快照、设置自动保存在浏览器 localStorage。</div><div class="storage-info">占用 ${getStorageSize()} · ${state.projects.length} 个项目</div></div></div>
      <div class="set-row"><div class="info"><div class="t">导出全部数据</div><div class="d">生成 JSON 备份文件，可在另一台设备导入恢复。</div></div><button class="btn primary" id="set-export">导出 JSON</button></div>
      <div class="set-row"><div class="info"><div class="t">导入数据</div><div class="d">从 JSON 备份文件恢复全部项目（会覆盖当前数据）。</div></div><button class="btn" id="set-import">选择文件\u2026</button></div>
      <div class="set-row"><div class="info"><div class="t">清除本地数据</div><div class="d">删除所有项目和设置，恢复空白状态。不可撤销。</div></div><button class="btn danger" id="set-clear">清除</button></div>
    </div>
    <div style="margin-top:20px"><button class="btn" id="set-reset">恢复默认设置</button></div>
  </div>`;
  $('#set-sortcol').onchange=e=>{s.defaultSortColumn=e.target.value.trim();persist();toast('已更新');};
  $('#set-baseline').onchange=e=>{s.baselineKeyword=e.target.value.trim();persist();toast('已更新');};
  $('#set-dec').onchange=e=>{s.decimals=Math.max(0,Math.min(6,parseInt(e.target.value)||0));e.target.value=s.decimals;if(state.view==='project')renderTable(getProject());persist();};
  $('#set-diff').onclick=e=>{s.showDiff=!s.showDiff;e.target.classList.toggle('on',s.showDiff);if(state.view==='project')renderTable(getProject());persist();};
  $('#set-percell').onclick=e=>{s.colorPerCell=!s.colorPerCell;e.target.classList.toggle('on',s.colorPerCell);if(state.view==='project')renderTable(getProject());persist();};
  $('#set-theme').onclick=e=>{setTheme(s.theme==='dark'?'light':'dark');e.target.classList.toggle('on',s.theme==='dark');persist();};
  $('#set-reset').onclick=()=>{Object.assign(s,defaultSettings);persist();renderSettings();toast('设置已恢复默认');};
  $('#set-clear').onclick=()=>{if(confirm('确认清除所有本地数据？不可撤销。')){clearStorage();state.projects=[];state.activeId=null;state.seq=0;renderProjectList();setView('home');}};
  $('#set-export').onclick=()=>exportAllData();
  $('#set-import').onclick=()=>$('#json-input').click();
  buildChips($('#chips-lb'),s.lowerBetterKeywords);buildChips($('#chips-info'),s.infoKeywords);
}
function buildChips(container,arr){const draw=()=>{container.innerHTML=arr.map((k,i)=>'<span class="chip">'+escapeHtml(k)+'<button data-i="'+i+'">&times;</button></span>').join('')+'<input type="text" placeholder="+ 添加"/>';container.querySelectorAll('button').forEach(b=>b.onclick=()=>{arr.splice(+b.dataset.i,1);draw();persist();});const inp=container.querySelector('input');inp.onkeydown=e=>{if(e.key==='Enter'||e.key===','){const v=inp.value.trim().toLowerCase();if(v&&!arr.includes(v))arr.push(v);inp.value='';draw();persist();container.querySelector('input').focus();}};};draw();}

/* =========================================================================
   Sidebar + Theme + Resize

function applyFavicon(t){const svg=t==='dark'?LOGO_SVG.dark:LOGO_SVG.light;const el=document.getElementById('app-favicon');if(el)el.setAttribute('href','data:image/svg+xml,'+encodeURIComponent(svg));}

      <stop offset="0.4" stop-color="#FFD24A"/>

</svg>`,

</svg>`
};
function collapseSidebar(){state.sideCollapsed=true;$('#sidebar').classList.add('collapsed');}
function expandSidebar(){state.sideCollapsed=false;$('#sidebar').classList.remove('collapsed');$('#sidebar').style.width=state.sideWidth+'px';}
$('#collapse-btn').onclick=e=>{e.stopPropagation();collapseSidebar();};
$('#ws-logo').onclick=()=>{if(state.sideCollapsed)expandSidebar();};
$('#expand-btn').onclick=()=>expandSidebar();
$('#toggle-side').onclick=()=>{state.sideCollapsed?expandSidebar():collapseSidebar();};
$('#theme-btn').onclick=()=>{setTheme(state.settings.theme==='dark'?'light':'dark');persist();};
(function(){const h=$('#resize-handle'),sb=$('#sidebar'),MIN=180,MAX=420;let sx=0,sw=0,drag=false;h.addEventListener('mousedown',e=>{if(state.sideCollapsed)return;e.preventDefault();drag=true;sx=e.clientX;sw=sb.offsetWidth;h.classList.add('active');document.body.style.cursor='col-resize';document.body.style.userSelect='none';sb.style.transition='none';});window.addEventListener('mousemove',e=>{if(!drag)return;sb.style.width=Math.max(MIN,Math.min(MAX,sw+(e.clientX-sx)))+'px';state.sideWidth=parseInt(sb.style.width);});window.addEventListener('mouseup',()=>{if(!drag)return;drag=false;h.classList.remove('active');document.body.style.cursor='';document.body.style.userSelect='';sb.style.transition='';persist();});})();

/* =========================================================================
   Global bindings
   ========================================================================= */
$('#nav-home').onclick=()=>setView('home');
$('#nav-settings').onclick=()=>setView('settings');
$('#nav-projects').onclick=()=>{state.projectsOpen=!state.projectsOpen;$('#proj-list').classList.toggle('hide',!state.projectsOpen);$('#proj-chev').classList.toggle('open',state.projectsOpen);renderProjectList();};
$('#file-input').onchange=e=>{handleFiles(e.target.files);e.target.value='';};
$('#json-input').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{importAllData(ev.target.result);};r.readAsText(f);e.target.value='';};
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer.files.length)handleFiles(e.dataTransfer.files);});
window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='o'){e.preventDefault();$('#file-input').click();}});

/* ---- Boot ---- */
(function boot(){
  const had=restore();setTheme(state.settings.theme);applyFavicon(state.settings.theme);
  if(state.sideWidth&&state.sideWidth!==256)$('#sidebar').style.width=state.sideWidth+'px';
  if(had&&state.activeId&&state.projects.find(p=>p.id===state.activeId))setActive(state.activeId);
  else if(had&&state.projects.length)setActive(state.projects.find(p=>!p.isSnapshot)?.id||state.projects[0].id);
  else setView('home');
  renderProjectList();
})();
</script>
